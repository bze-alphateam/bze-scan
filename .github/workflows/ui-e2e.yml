name: UI e2e tests

on:
  # On main and develop these run from release.yml, which publishes the
  # images only after the tests pass.
  workflow_call:
  # Every pull request, whatever it touches: these are required checks of
  # the main ruleset, and a path filter would leave a pull request that
  # skips them (docs, other workflows) waiting forever.
  pull_request:

permissions:
  contents: read

# The group is spelled out: called from release.yml, github.workflow would
# name the caller and share its group.
concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser bundle points at the mock API (test/mock-api).
      - name: Build
        run: pnpm build:e2e

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the mock API and `next start` itself.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
