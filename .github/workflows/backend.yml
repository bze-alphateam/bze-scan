name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: Unit tests
        run: make test

      # PostgreSQL comes from docker/compose.yml (not a service container) so
      # the vendored sink schema is applied exactly as it is locally.
      - name: Acceptance tests
        run: make e2e
