name: Backend e2e tests

on:
  # On main these run from backend-image.yml, which publishes the image only
  # after both pass.
  workflow_call:
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-e2e.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress; runs on main
# always finish. The group is spelled out: called from backend-image.yml,
# github.workflow would name the caller and share its group.
concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # PostgreSQL comes from docker/compose.yml (not a service container) so
      # the vendored sink schema is applied exactly as it is locally.
      - name: Acceptance tests
        run: make e2e
