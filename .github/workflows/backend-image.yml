name: Backend image

# Builds docker/backend.Dockerfile and smoke-tests the image. Two callers:
#
# - pull requests: build + smoke test only, never pushed;
# - release.yml (pushes to main and develop): called with the release's tag
#   after the unit and e2e tests passed, it also pushes
#   ghcr.io/bze-alphateam/bze-scan-backend:<tag> (plus :latest from main).
#
# The image is network-agnostic: main's <sha8> and develop's testnet-<sha8>
# are the same build, only the tag differs.
on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"
  workflow_call:
    inputs:
      tag:
        description: "Tag to push: <sha8> (main) or testnet-<sha8> (develop)"
        required: true
        type: string
      latest:
        description: "Also push :latest"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress. The group is
# spelled out: called from release.yml, github.workflow would name the caller.
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bze-alphateam/bze-scan-backend

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        # sha = the first 8 characters of the commit (what `version` prints);
        # tag = the release's tag when called, else the sha (pull requests).
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-$sha}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          docker build -f docker/backend.Dockerfile
          --build-arg GIT_SHA=${{ steps.vars.outputs.sha }}
          -t "$IMAGE:${{ steps.vars.outputs.tag }}" .

      - name: Smoke test
        run: docker/smoke-test.sh "$IMAGE:${{ steps.vars.outputs.tag }}" ${{ steps.vars.outputs.sha }}

      - name: Log in to GHCR
        if: inputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: inputs.tag != ''
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          docker push "$IMAGE:$TAG"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "Pushed \`$IMAGE:$TAG\`$([ "$LATEST" = "true" ] && echo ' and `:latest`')." >> "$GITHUB_STEP_SUMMARY"
