name: Backend lint

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"
  # Every pull request, whatever it touches: these are required checks of
  # the main ruleset, and a path filter would leave a pull request that
  # skips them (docs, other workflows) waiting forever.
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress; runs on main
# and develop always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: Modules tidy
        run: make tidy-check

      - name: Vulnerabilities
        run: make vulncheck
