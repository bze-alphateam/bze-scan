name: Backend lint

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"
  # Every pull request, whatever it touches: this is a required check of the
  # main ruleset, so the trigger takes no path filter (see the changes job).
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress; runs on main
# and develop always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request: does it touch what this check covers? Called from
  # release.yml (pushes to main and develop) it is skipped and lint runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pr-touches.sh '^backend/' '^\.github/workflows/backend-lint\.yml$' '^\.github/scripts/pr-touches\.sh$'

  lint:
    needs: changes
    # Skipped (= a passing required check) only when the pull request touches
    # none of its paths. Outside pull requests, or if the changes job failed,
    # it runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: Modules tidy
        run: make tidy-check

      - name: Vulnerabilities
        run: make vulncheck
