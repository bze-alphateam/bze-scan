name: Backend unit tests

on:
  # On main these run from backend-image.yml, which publishes the image only
  # after both pass.
  workflow_call:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress; runs on main
# always finish. The group is spelled out: called from backend-image.yml,
# github.workflow would name the caller and share its group.
concurrency:
  group: backend-unit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # No network, no database: every dependency is mocked.
      - name: Unit tests
        run: make test
