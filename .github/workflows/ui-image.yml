name: UI image

# Builds docker/ui.Dockerfile and smoke-tests the image on every pull request
# (never pushed), with ui/.env.dist as the build env. On pushes to main it
# runs the unit and e2e workflows first and, only when both pass, builds with
# the production build env and pushes ghcr.io/bze-alphateam/bze-scan-ui:<sha8>
# and :latest. Deploying is not this repository's job.
#
# The production build env (the NEXT_PUBLIC_* values inlined into the bundle)
# is scan.getbze.com/build.env in the private deploy repository, checked out
# with the DEPLOY_REPO_TOKEN org secret and handed to `docker build` as a
# BuildKit secret: it never enters the build context, an image layer or the
# log. Only push runs use the token, so pull requests never see it.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "docker/ui.Dockerfile*"
      - "docker/ui-smoke-test.sh"
      - ".github/workflows/ui-image.yml"
      - ".github/workflows/ui-unit.yml"
      - ".github/workflows/ui-e2e.yml"
  pull_request:
    paths:
      - "ui/**"
      - "docker/ui.Dockerfile*"
      - "docker/ui-smoke-test.sh"
      - ".github/workflows/ui-image.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress; runs on main
# always finish, one at a time, so tags are pushed in commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bze-alphateam/bze-scan-ui
  DEPLOY_DIR: scan.getbze.com

jobs:
  # On main the test workflows run from here (they have no push trigger of
  # their own), so the publish job can wait for them.
  unit:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ui-unit.yml

  e2e:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ui-e2e.yml

  image:
    needs: [unit, e2e]
    # Pull requests skip unit and e2e here (their own workflows run them).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        # The first 8 characters of the commit, like the other BZE images.
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      # Sparse checkout of the one deploy dir into deploy/ (outside the image's
      # build context). The token is not persisted in the checkout's config.
      # Until the deploy dir exists the build falls back to ui/.env.dist.
      - name: Check out the build env from the deploy repository
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bze-alphateam/bze-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
          sparse-checkout: ${{ env.DEPLOY_DIR }}
          persist-credentials: false

      - name: Pick the build env
        id: env
        # Presence and shape only: the file is never printed.
        run: |
          prod="deploy/$DEPLOY_DIR/build.env"
          if [ "${{ github.event_name }}" != "push" ]; then
            file=ui/.env.dist
          elif [ -s "$prod" ] && grep -q '^NEXT_PUBLIC_' "$prod"; then
            file=$prod
            echo "Build env: \`$DEPLOY_DIR/build.env\` from the deploy repository ($(grep -c '^NEXT_PUBLIC_' "$prod") NEXT_PUBLIC_* values)." >> "$GITHUB_STEP_SUMMARY"
          else
            file=ui/.env.dist
            echo "::warning::$DEPLOY_DIR/build.env is missing or holds no NEXT_PUBLIC_ values in the deploy repository: building with ui/.env.dist"
            echo "⚠️ Built with \`ui/.env.dist\`: \`$DEPLOY_DIR/build.env\` is not available in the deploy repository. This image points the browser at localhost and is for testing only." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          docker build -f docker/ui.Dockerfile
          --secret id=build_env,src=${{ steps.env.outputs.file }}
          --build-arg GIT_SHA=${{ steps.vars.outputs.sha }}
          -t "$IMAGE:${{ steps.vars.outputs.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test
        run: docker/ui-smoke-test.sh "$IMAGE:${{ steps.vars.outputs.sha }}" ${{ steps.vars.outputs.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ steps.vars.outputs.sha }}"
          docker push "$IMAGE:latest"
          echo "Pushed \`$IMAGE:${{ steps.vars.outputs.sha }}\` and \`:latest\`." >> "$GITHUB_STEP_SUMMARY"
