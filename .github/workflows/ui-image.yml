name: UI image

# Builds docker/ui.Dockerfile and smoke-tests the image. Two callers:
#
# - pull requests: build + smoke test with ui/.env.dist as the build env,
#   never pushed;
# - release.yml (pushes to main and develop): called with the release's tag
#   and its deploy dir after the unit and e2e tests passed, it builds with
#   that deploy target's build env and pushes
#   ghcr.io/bze-alphateam/bze-scan-ui:<tag> (plus :latest from main).
#
# The build env (the NEXT_PUBLIC_* values inlined into the bundle) differs per
# network, so main's <sha8> and develop's testnet-<sha8> are different builds.
# It is <deploy dir>/build.env in the private deploy repository, checked out
# with the DEPLOY_REPO_TOKEN org secret and handed to `docker build` as a
# BuildKit secret: it never enters the build context, an image layer or the
# log. Only release runs use the token, so pull requests never see it.
on:
  pull_request:
    paths:
      - "ui/**"
      - "docker/ui.Dockerfile*"
      - "docker/ui-smoke-test.sh"
      - ".github/workflows/ui-image.yml"
  workflow_call:
    inputs:
      tag:
        description: "Tag to push: <sha8> (main) or testnet-<sha8> (develop)"
        required: true
        type: string
      deploy_dir:
        description: "The deploy target whose build.env the image is built with"
        required: true
        type: string
      require_build_env:
        description: "Fail when the deploy dir has no build.env (an image that will be deployed); false falls back to ui/.env.dist"
        required: true
        type: boolean
      latest:
        description: "Also push :latest"
        required: false
        type: boolean
        default: false
    secrets:
      DEPLOY_REPO_TOKEN:
        required: true

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress. The group is
# spelled out: called from release.yml, github.workflow would name the caller.
concurrency:
  group: ui-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bze-alphateam/bze-scan-ui

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        # sha = the first 8 characters of the commit (the revision label);
        # tag = the release's tag when called, else the sha (pull requests).
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-$sha}" >> "$GITHUB_OUTPUT"

      # Sparse checkout of the one deploy dir into deploy/ (outside the image's
      # build context). The token is not persisted in the checkout's config.
      # A missing dir is handled by the next step.
      - name: Check out the build env from the deploy repository
        if: inputs.deploy_dir != ''
        continue-on-error: ${{ !inputs.require_build_env }}
        uses: actions/checkout@v7
        with:
          repository: bze-alphateam/bze-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
          sparse-checkout: ${{ inputs.deploy_dir }}
          persist-credentials: false

      - name: Pick the build env
        id: env
        # Presence and shape only: the file is never printed.
        env:
          DEPLOY_DIR: ${{ inputs.deploy_dir }}
          REQUIRED: ${{ inputs.require_build_env }}
        run: |
          if [ -z "$DEPLOY_DIR" ]; then
            echo "file=ui/.env.dist" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prod="deploy/$DEPLOY_DIR/build.env"
          if [ -s "$prod" ] && grep -q '^NEXT_PUBLIC_' "$prod"; then
            echo "file=$prod" >> "$GITHUB_OUTPUT"
            echo "Build env: \`$DEPLOY_DIR/build.env\` from the deploy repository ($(grep -c '^NEXT_PUBLIC_' "$prod") NEXT_PUBLIC_* values)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REQUIRED" = "true" ]; then
            echo "::error::$DEPLOY_DIR/build.env is missing or holds no NEXT_PUBLIC_ values in the deploy repository: this image would be deployed, refusing to build it with ui/.env.dist"
            exit 1
          else
            echo "file=ui/.env.dist" >> "$GITHUB_OUTPUT"
            echo "::warning::$DEPLOY_DIR/build.env is missing or holds no NEXT_PUBLIC_ values in the deploy repository: building with ui/.env.dist"
            echo "⚠️ Built with \`ui/.env.dist\`: \`$DEPLOY_DIR/build.env\` is not available in the deploy repository. This image points the browser at localhost and is for testing only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: >
          docker build -f docker/ui.Dockerfile
          --secret id=build_env,src=${{ steps.env.outputs.file }}
          --build-arg GIT_SHA=${{ steps.vars.outputs.sha }}
          -t "$IMAGE:${{ steps.vars.outputs.tag }}" .

      - name: Smoke test
        run: docker/ui-smoke-test.sh "$IMAGE:${{ steps.vars.outputs.tag }}" ${{ steps.vars.outputs.sha }}

      - name: Log in to GHCR
        if: inputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: inputs.tag != ''
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          docker push "$IMAGE:$TAG"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "Pushed \`$IMAGE:$TAG\`$([ "$LATEST" = "true" ] && echo ' and `:latest`')." >> "$GITHUB_STEP_SUMMARY"
