name: UI unit tests

on:
  # On main these run from ui-image.yml, which publishes the image only after
  # both pass.
  workflow_call:
  pull_request:
    paths:
      - "ui/**"
      # bze.test.tsx checks every BZE type classified there has a renderer.
      - "backend/internal/classify/classify.go"
      - ".github/workflows/ui-unit.yml"

permissions:
  contents: read

# The group is spelled out: called from ui-image.yml, github.workflow would
# name the caller and share its group.
concurrency:
  group: ui-unit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # jsdom and a fake API: no network, no server.
      - name: Unit tests
        run: pnpm test
