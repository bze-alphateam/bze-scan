name: UI unit tests

on:
  # On main and develop these run from release.yml, which publishes the
  # images only after the tests pass.
  workflow_call:
  # Every pull request, whatever it touches: these are required checks of
  # the main ruleset, and a path filter would leave a pull request that
  # skips them (docs, other workflows) waiting forever.
  pull_request:

permissions:
  contents: read

# The group is spelled out: called from release.yml, github.workflow would
# name the caller and share its group.
concurrency:
  group: ui-unit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # jsdom and a fake API: no network, no server.
      - name: Unit tests
        run: pnpm test
