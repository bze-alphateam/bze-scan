name: UI unit tests

on:
  # On main and develop these run from release.yml, which publishes the
  # images only after the tests pass.
  workflow_call:
  # Every pull request, whatever it touches: this is a required check of the
  # main ruleset, so the trigger takes no path filter (see the changes job).
  pull_request:

permissions:
  contents: read

# The group is spelled out: called from release.yml, github.workflow would
# name the caller and share its group.
concurrency:
  group: ui-unit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request: does it touch what this check covers? Called from
  # release.yml (pushes to main and develop) it is skipped and unit runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pr-touches.sh '^ui/' '^backend/internal/classify/classify\.go$' '^\.github/workflows/ui-unit\.yml$' '^\.github/scripts/pr-touches\.sh$'

  unit:
    needs: changes
    # Skipped (= a passing required check) only when the pull request touches
    # none of its paths. Outside pull requests, or if the changes job failed,
    # it runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # jsdom and a fake API: no network, no server.
      - name: Unit tests
        run: pnpm test
